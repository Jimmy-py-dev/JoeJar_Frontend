<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | O-Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">
    
    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white/10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900">O-LITE</h1>
            <p class="text-sm font-bold text-slate-400 mt-2">Sign in to continue</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <input type="text" name="username" placeholder="Username" autocomplete="username" required class="w-full p-4 sm:p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-indigo-600 font-medium">
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required class="w-full p-4 sm:p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-indigo-600 font-medium">
            <button type="submit" class="w-full bg-indigo-600 text-white py-4 sm:py-5 rounded-2xl font-black shadow-xl shadow-indigo-200 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition">Sign In</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
